name: Build Windows
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build VST3
        run: msbuild "Builds/VisualStudio2022/SEYA'S COMP.sln" /p:Configuration=Release /p:Platform=x64
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Make Installer
        run: iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: SEYA_MUKISA_COMP_Windows_Installer.exe
